services:
  django-app:
    build: .
    image: rag-django:latest
    container_name: django_app
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - .env
    ports:
      - "8000"
    volumes:
      # Pipeline log files — persisted on host so logs survive container rebuilds.
      # Host path: /opt/apps/logs/django  →  container path: /var/log/rag
      # Run once on VPS: mkdir -p /opt/apps/logs/django && chmod 777 /opt/apps/logs/django
      - /opt/apps/logs/django:/var/log/rag
      # SEC daily feed JSON (collector + processor) — survives redeploys.
      # Run once on VPS: mkdir -p /opt/apps/sec_daily_feed && chmod 777 /opt/apps/sec_daily_feed
      - /opt/apps/sec_daily_feed:/app/rag_project/sec_rss_parser/sec_daily_feed
    environment:
      - PORT=8000
      - LOG_ROOT=/var/log/rag
      - SEC_FEED_DAILY_DIR=/app/rag_project/sec_rss_parser/sec_daily_feed
      - SEC_FEED_TIMEZONE=America/New_York
      - SEC_FEED_MIDNIGHT_GRACE_MINUTES=30
      # 8-K process-feed API: legacy n8n path. Prefer poller's JSON 8-K queue;
      # keep at 0/1 only if you still need the API during cutover.
      - SEC_8K_PROCESSOR_WORKERS=0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django-app.rule=Host(`django.arbintel.cloud`)"
      - "traefik.http.routers.django-app.entrypoints=websecure"
      - "traefik.http.routers.django-app.tls=true"
      - "traefik.http.routers.django-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.django-app.loadbalancer.server.port=8000"

  # SEC feed poller: collector (Stage A) + all-filings processor (Stage B) +
  # 8-K-from-JSON processor (Stage B2) + reconcile in ONE process.
  # Document fetches use sticky residential proxies (sec_proxy_fetch).
  # Run exactly ONE replica.
  sec-feed-poller:
    image: rag-django:latest
    depends_on:
      - django-app
    container_name: sec_feed_poller
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - .env
    command: python manage.py run_sec_feed_poller
    volumes:
      # Same log + feed volumes as the web app so both see the same JSON.
      - /opt/apps/logs/django:/var/log/rag
      - /opt/apps/sec_daily_feed:/app/rag_project/sec_rss_parser/sec_daily_feed
    environment:
      - LOG_ROOT=/var/log/rag
      - SEC_FEED_DAILY_DIR=/app/rag_project/sec_rss_parser/sec_daily_feed
      - SEC_FEED_TIMEZONE=America/New_York
      - SEC_FEED_MIDNIGHT_GRACE_MINUTES=30
      - SEC_FEED_COLLECTOR_INTERVAL_SEC=1.0
      - SEC_FEED_PROCESSOR_INTERVAL_SEC=15.0
      - SEC_FEED_PROCESSOR_WORKERS=20
      - SEC_FEED_8K_INTERVAL_SEC=15.0
      - SEC_FEED_8K_WORKERS=20
      - SEC_FEED_GLOBAL_FORM_INTERVAL_SEC=15.0
      - SEC_FEED_GLOBAL_FORM_WORKERS=20
      - SEC_FEED_DEAL_CIK_REFRESH_SEC=60.0
      # Listing (getcurrent) only — Archives doc fetches use sticky proxies.
      - SEC_MIN_REQ_INTERVAL=0.2
      - SEC_PROXY_MAX_ATTEMPTS=5
      - SEC_PROXY_TIMEOUT=12
