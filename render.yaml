services:
  # Main Django Web Service
  - type: web
    name: rag-django
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn rag_project.asgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --reload"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: rag_project.settings

      - key: PYTHON_VERSION
        value: 3.12.4
      
      - key: PYTHONPATH
        value: /opt/render/project/src/rag_project

      - key: WEB_CONCURRENCY
        value: "3"

      # External API / Service Keys (marked sync: false)
      - key: NODE_API_BASE_URL
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false

      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: MONGODB_NAME
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ORG_ID
        sync: false
      - key: OPENAI_API_URL
        sync: false
      - key: OPENAI_ASSISTANT_ID
        sync: false

      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false

      - key: PINECONE_API_KEY1
        sync: false
      - key: PINECONE_ENVIRONMENT1
        sync: false
      - key: PINECONE_INDEX_NAME1
        sync: false

  # Daily Reddit Scraper Cron Job
  - type: cron
    name: daily-reddit-scraper
    env: python
    plan: free
    buildCommand: "./build.sh"
    schedule: "0 2 * * *"  # Run daily at 2:00 AM UTC
    startCommand: "python rag_project/daily_reddit_scraper.py"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: rag_project.settings
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: PYTHONPATH
        value: /opt/render/project/src/rag_project
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: MONGODB_NAME
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false



  # Daily Riffle Approach 2 Cron Job
  - type: cron
    name: daily-riffle-approach-2
    env: python
    plan: free
    buildCommand: "./build.sh"
    schedule: "0 2 * * *"  # Run daily at 2:00 AM UTC
    startCommand: "python rag_project/run_daily_riffle_approach_2.py"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: rag_project.settings
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: PYTHONPATH
        value: /opt/render/project/src/rag_project
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: MONGODB_NAME
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false

